<!-- templates/logout.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déconnexion - Obidon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .logout-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 5px solid #D4AF37;
        }
        .icon-box {
            font-size: 50px;
            color: #5D4037;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 { color: #5D4037; margin-bottom: 10px; font-size: 24px; }
        p { color: #666; margin-bottom: 30px; line-height: 1.5; }
        .actions { display: flex; gap: 10px; justify-content: center; }
        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-cancel { background: #eee; color: #555; }
        .btn-cancel:hover { background: #ddd; }
        .btn-confirm {
            background: linear-gradient(135deg, #D32F2F, #B71C1C);
            color: white;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
        }
        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.4);
        }
    </style>
</head>
<body>
    <div class="logout-card">
        <div class="icon-box">
            <i class="fas fa-sign-out-alt"></i>
        </div>
        <h1>Au revoir ! 👋</h1>
        <p>Êtes-vous sûr de vouloir quitter votre espace personnel ?</p>
        
        <!-- Formulaire qui pointe vers la vue de déconnexion -->
        <form method="post" action="{% url 'core:logout' %}">
            {% csrf_token %}
            <div class="actions">
                <a href="{% url 'core:home' %}" class="btn btn-cancel">
                    <i class="fas fa-arrow-left"></i> Retour
                </a>
                <button type="submit" class="btn btn-confirm">
                    Oui, se déconnecter
                </button>
            </div>
        </form>
    </div>
</body>
</html>
